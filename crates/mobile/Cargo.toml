[package]
name = "naive-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "naive_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
naive-voice-session.workspace = true
naive-orb.workspace = true
naive-veil.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uniffi = "0.32"
naive-markdown.workspace = true
naive-text.workspace = true
naive-visual.workspace = true
naive-visual-gpu.workspace = true
naive-doc.workspace = true
naive-proto.workspace = true
naive-client.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
naive-syntax.workspace = true
zatex = { workspace = true, features = ["bundled"] }
thiserror.workspace = true
naive-term.workspace = true
